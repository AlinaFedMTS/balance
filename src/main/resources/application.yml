spring:
  application:
    name: hold-ledger-service

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# [ASSUMPTION] Minimal reconciliation batch size; exact value not specified by ФТ-BALANCE-001.
app:
  reconciliation:
    batch-size: 500
